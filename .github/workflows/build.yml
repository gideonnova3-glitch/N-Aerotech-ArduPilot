name: Build ArduPilot Custom Board

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ArduPilot Full Source
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: master
          submodules: recursive

      - name: Inject Custom Board hwdef
        run: |
          # Menyalin file hwdef.dat buatanmu ke dalam direktori build ardupilot
          mkdir -p libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405
          if [ -f "libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat" ]; then
            echo "File hwdef.dat kustom ditemukan di repositori."
          fi

      - name: Set up Python & GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip3 install empy==3.3.4 pexpect

      - name: Configure and Compile Copter
        run: |
          # Melakukan update/refresh modul dan mendeteksi hwdef kustom
          python3 waf.py configure --board N-Aerotech-F405 --disable-bootloader
          python3 waf.py copter

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Aerotech-F405-Copter
          path: build/N-Aerotech-F405/bin/
