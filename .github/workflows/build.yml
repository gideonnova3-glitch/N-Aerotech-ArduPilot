name: Build ArduPilot Custom Board

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ArduPilot Full Source
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: master
          submodules: recursive

      - name: Create Custom Board Folder & hwdef
        run: |
          mkdir -p libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405
          cat << 'EOF' > libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat
          include ../SpeedyBeeF405WING/hwdef.dat
          BOARD_NAME N-Aerotech-F405
          EOF

      - name: Generate or Link Bootloader
        run: |
          # Menyalin bootloader bawaan SpeedyBeeF405WING agar terbaca sebagai bootloader N-Aerotech-F405
          if [ -f "Tools/bootloaders/SpeedyBeeF405WING_b1.bin" ]; then
            cp Tools/bootloaders/SpeedyBeeF405WING_b1.bin Tools/bootloaders/N-Aerotech-F405_b1.bin
          elif [ -f "Tools/bootloaders/speedybeef405wing_b1.bin" ]; then
            cp Tools/bootloaders/speedybeef405wing_b1.bin Tools/bootloaders/N-Aerotech-F405_b1.bin
          else
            # Jika tidak ada, buat salinan dummy atau jalankan script build bootloader resmi
            python3 Tools/scripts/build_bootloaders.py SpeedyBeeF405WING
            cp Tools/bootloaders/SpeedyBeeF405WING_b1.bin Tools/bootloaders/N-Aerotech-F405_b1.bin || true
          fi

      - name: Set up Python & GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip3 install empy==3.3.4 pexpect

      - name: Configure and Compile Copter
        run: |
          ./waf configure --board N-Aerotech-F405
          ./waf copter

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Aerotech-F405-Copter
          path: build/N-Aerotech-F405/bin/
