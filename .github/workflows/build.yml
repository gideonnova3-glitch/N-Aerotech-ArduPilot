name: Build ArduPilot Custom Board

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Custom Repository (For hwdef)
        uses: actions/checkout@v4

      - name: Checkout Official ArduPilot Source
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: master
          submodules: recursive
          path: ardupilot_src

      - name: Inject Custom Board hwdef into ArduPilot
        run: |
          mkdir -p ardupilot_src/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405
          if [ -d "ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405" ]; then
            cp -r ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/* ardupilot_src/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/
          elif [ -d "libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405" ]; then
            cp -r libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/* ardupilot_src/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/
          fi

      - name: Set up Python & GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip3 install empy==3.3.4 pexpect

      - name: Configure and Compile Copter
        run: |
          cd ardupilot_src
          ./waf configure --board N-Aerotech-F405 --disable-bootloader
          ./waf copter

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Aerotech-F405-Copter
          path: ardupilot_src/build/N-Aerotech-F405/bin/
```[cite: 11, 12]

Setelah kamu memperbarui file tersebut di GitHub, masuk kembali ke menu **Actions**, pilih *workflow* **Build ArduPilot Custom Board** di bilah kiri, lalu tombol **Run workflow** akan muncul di sebelah kanan atas untuk memulai proses *build* baru secara manual[cite: 13].
