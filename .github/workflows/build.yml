name: Build ArduPilot Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      - name: Clone ArduPilot Source
        run: |
          git clone --recurse-submodules https://github.com/ArduPilot/ardupilot.git ardupilot_src

      - name: Copy Custom Board Definition to ArduPilot
        run: |
          mkdir -p ardupilot_src/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405
          if [ -f "ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat" ]; then
            cp ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat ardupilot_src/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Prerequisites
        run: |
          cd ardupilot_src
          pip install empy==3.3.4 pexpect
          Tools/environment_install/install-prereqs-the-hard-way.sh -y

      - name: Compile Firmware
        run: |
          cd ardupilot_src
          export PATH=$PATH:/opt/gcc-arm-none-eabi/bin
          ./waf configure --board N-Aerotech-F405
          ./waf copter

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Aerotech-F405-Firmware
          path: ardupilot_src/build/N-Aerotech-F405/bin/
