name: Build ArduPilot Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Board Definition
        run: |
          # Memastikan folder hwdef N-Aerotech-F405 ada di dalam source ardupilot (jika repo ini di-clone sebagai modul atau digabung)
          # Atau kita salin dari folder root ke ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/
          mkdir -p ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405
          if [ -f "libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat" ]; then
            cp libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/hwdef.dat ArduPilot/libraries/AP_HAL_ChibiOS/hwdef/N-Aerotech-F405/
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Prerequisites
        run: |
          cd ArduPilot
          pip install empy==3.3.4 pexpect
          Tools/environment_install/install-prereqs-the-hard-way.sh -y

      - name: Compile Firmware
        run: |
          cd ArduPilot
          export PATH=$PATH:/opt/gcc-arm-none-eabi/bin
          ./waf configure --board N-Aerotech-F405
          ./waf copter

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Aerotech-F405-Firmware
          path: ArduPilot/build/N-Aerotech-F405/bin/
